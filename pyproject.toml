[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]

[tool.ruff.lint.per-file-ignores]
# реплики и промпт — длинные строки текста
"bot/texts.py" = ["E501"]
"bot/prompt.py" = ["E501"]
